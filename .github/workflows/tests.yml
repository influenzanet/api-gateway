name: Tests

on:
  pull_request:
  push:
    branches:
      - dev-orbyta

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Go version go.mod requires, so the build does not download a toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      # The api-gateway suite is self-contained: the gRPC clients it talks to
      # are faked in the tests, so it needs no database and no other service.
      - name: Test
        # -v so that the next step can see skipped tests; bash for pipefail.
        shell: bash
        run: go test -race -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # A skipped test is a test CI did not run.
      - name: No skipped tests
        run: |
          if grep -E -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "Tests were skipped; CI must run every test."
            exit 1
          fi
